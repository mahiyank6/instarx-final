<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#03045E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="InstaRX">
<title>InstaRX</title>
<link rel="icon" href="/img/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="app">

<!-- sticky glass header: location + search, always visible -->
<div class="app-top">
  <div class="app-loc">
    <span class="pin">📍</span>
    <span class="where" id="app-where">Detecting location…</span>
    <button id="app-loc-btn">Change</button>
  </div>
  <div style="position:relative;">
    <div class="app-search">
      <span class="mag">🔍</span>
      <input id="app-search-input" type="search" placeholder="Search medicines, health products…"
             autocomplete="off" enterkeyhint="search">
    </div>
    <div class="app-suggest" id="app-suggest"></div>
  </div>
</div>

<main id="app-view"><div class="container"></div></main>

<!-- floating cart bar -->
<div class="checkout-bar" id="checkout-bar">
  <div class="cb-left">
    <div class="cb-amt" id="cb-amt">₹0</div>
    <div class="cb-sub" id="cb-sub">0 items</div>
  </div>
  <button class="cb-go" id="cb-go">View cart →</button>
</div>

<!-- bottom tabs -->
<nav class="tabbar">
  <a href="#/home" data-tab="home" class="on"><span class="ti">🏠</span>Home</a>
  <a href="#/shop" data-tab="shop"><span class="ti">💊</span>Shop</a>
  <a href="#/cart" data-tab="cart"><span class="ti">🛒</span>Cart<span class="tb-badge" id="tab-badge" style="display:none;">0</span></a>
  <a href="#/orders" data-tab="orders"><span class="ti">🚚</span>Orders</a>
  <a href="#/account" data-tab="account"><span class="ti">👤</span>Account</a>
</nav>

<script src="/js/illustrations.js"></script>
<script src="/js/common.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
