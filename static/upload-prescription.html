<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prescription Chat — InstaRX</title>
<link rel="icon" href="/img/favicon.ico" sizes="any">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="site-header"></div>

<section class="section rx-section">
  <div class="container rx-wrap">
    <div class="rx-chat" id="rx-chat">
      <div class="rx-head">
        <div class="rx-avatar">Rx</div>
        <div style="min-width:0;">
          <div class="nm">Prescription chat</div>
          <div class="st">The nearest chemist checks stock and replies here</div>
        </div>
        <button type="button" class="rx-history-btn" id="rx-history" aria-label="History of your prescriptions">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
          <span>History</span>
        </button>
      </div>
      <div class="rx-thread" id="rx-thread"></div>
      <div class="rx-composer" id="rx-composer">
        <div class="rx-loc" id="rx-loc"></div>
        <button class="btn btn-primary btn-block" id="rx-send">📎 Send prescription</button>
      </div>
      <div class="rx-sheet-wrap" id="rx-sheet"></div>
    </div>
  </div>
</section>

<input type="file" id="rx-file" accept="image/*,.pdf" hidden>

<div id="site-footer"></div>

<script src="/js/illustrations.js"></script>
<script src="/js/common.js"></script>
<script src="/js/rx-chat.js"></script>
</body>
</html>
