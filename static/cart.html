<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — InstaRX</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="page-header"><div class="container"><h1>Your Cart</h1></div></div>

<section class="section">
  <div class="container">
    <div class="split-grid">
      <div class="panel" id="cart-panel"></div>
      <div class="side-col">
        <div class="panel">
          <div class="panel-title"><h3>Order Summary</h3></div>
          <div id="summary-block"></div>
        </div>
        <div class="panel">
          <div class="panel-title"><h3>Delivery Address</h3></div>
          <div id="address-block"></div>
        </div>
        <button class="btn btn-primary btn-block" id="place-order-btn">Proceed to Payment</button>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="/js/common.js"></script>
<script src="/js/cart.js"></script>
</body>
</html>
