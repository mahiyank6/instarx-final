<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <linearGradient id="gradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CAF0F8"/>
      <stop offset="100%" stop-color="#90E0EF"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#03045E" flood-opacity="0.34"/>
    </filter>
    <clipPath id="rightHalfClip">
      <rect x="100" y="20" width="100" height="160"/>
    </clipPath>
  </defs>

  <rect width="200" height="200" rx="44" fill="#F2FAFD"/>

  <g filter="url(#softShadow)" transform="rotate(-28 100 100)">
    <rect x="25" y="67" width="150" height="66" rx="33" fill="url(#gradDeep)"/>
    <rect x="25" y="67" width="150" height="66" rx="33" fill="url(#gradLight)" clip-path="url(#rightHalfClip)"/>
    <rect x="98" y="67" width="4" height="66" fill="#FFFFFF" opacity="0.7"/>
    <ellipse cx="58" cy="83" rx="22" ry="9" fill="#FFFFFF" opacity="0.28"/>
  </g>
</svg>
