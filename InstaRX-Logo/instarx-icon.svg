    <rect x="25" y="67" width="150" height="66" rx="33" fill="url(#gradWarm)"/>
    <rect x="25" y="67" width="150" height="66" rx="33" fill="url(#gradAmber)" clip-path="url(#rightHalfClip)"/>
    <rect x="98" y="67" width="4" height="66" fill="#FFFFFF" opacity="0.55"/>
    <ellipse cx="58" cy="83" rx="22" ry="9" fill="#FFFFFF" opacity="0.30"/>
