<svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9466"/>
      <stop offset="100%" stop-color="#C24B2B"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE1B8"/>
      <stop offset="100%" stop-color="#F2A93C"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#9A5C2D" flood-opacity="0.32"/>
    </filter>
    <clipPath id="rightHalfClip2">
      <rect x="60" y="0" width="60" height="120"/>
    </clipPath>
  </defs>

  <g filter="url(#softShadow)" transform="translate(0,6) rotate(-28 60 50)">
    <rect x="3" y="25" width="114" height="50" rx="25" fill="url(#gradWarm)"/>
    <rect x="3" y="25" width="114" height="50" rx="25" fill="url(#gradAmber)" clip-path="url(#rightHalfClip2)"/>
    <rect x="58" y="25" width="3" height="50" fill="#FFFFFF" opacity="0.55"/>
    <ellipse cx="28" cy="37" rx="15" ry="6" fill="#FFFFFF" opacity="0.30"/>
  </g>

  <text x="140" y="76" font-family="Sora, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="54">
    <tspan fill="#E1603D">Insta</tspan><tspan fill="#F2A93C">RX</tspan>
  </text>
</svg>
