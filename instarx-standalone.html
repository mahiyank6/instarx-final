const CHEMISTS_SEED = [
  ["MedRush Chemist - Andheri", "Andheri West, Mumbai", 19.1197, 72.8468],
  ["Apollo Pharmacy - Bandra", "Bandra West, Mumbai", 19.0596, 72.8295],
  ["Wellness Forever - Powai", "Powai, Mumbai", 19.1176, 72.9060],
  ["City Chemist - Dadar", "Dadar, Mumbai", 19.0178, 72.8478],
];

function seedDB() {
  const db = { users: [], chemists: [], medicines: [], orders: [], carts: {}, next_id: { user: 1, order: 1, medicine: 1 } };
  for (const [name, brand, category, price, mrp, unit, rating, rating_count, popular] of MEDICINES_SEED) {
    const id = db.next_id.medicine++;
    db.medicines.push({ id, name, brand, category, price, mrp, discount_pct: Math.round((1 - price / mrp) * 100), unit, rating, rating_count, popular, icon: CATEGORY_ICONS[category] || "\u{1F48A}", stock: true });
  }
  for (const [shop_name, address, lat, lng] of CHEMISTS_SEED) {
    const uid = db.next_id.user++;
    db.users.push({ id: uid, role: "chemist", name: shop_name, email: shop_name.toLowerCase().replace(/\s*-\s*/g, " ").trim().replace(/\s+/g, ".") + "@instarx.local", password: "demo1234", phone: "9800000000" });
    db.chemists.push({ user_id: uid, shop_name, license_no: `MH-PH-${String(uid).padStart(4, "0")}`, address, lat, lng, online: true });
  }
  saveDB(db);
  return db;
}

function loadDB() {
  const raw = localStorage.getItem(DB_KEY);
  if (!raw) return seedDB();
  try { return JSON.parse(raw); } catch (e) { return seedDB(); }
}
function saveDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
function nextId(db, kind) { db.next_id[kind] = db.next_id[kind] || 1; const id = db.next_id[kind]; db.next_id[kind] = id + 1; return id; }
function getSessionUserId() { const v = localStorage.getItem(SESSION_KEY); return v ? Number(v) : null; }
function setSessionUserId(id) { if (id) localStorage.setItem(SESSION_KEY, String(id)); else localStorage.removeItem(SESSION_KEY); }

function currentUser(db) { const uid = getSessionUserId(); return uid ? db.users.find((u) => u.id === uid) || null : null; }
function haversineKm(lat1, lng1, lat2, lng2) {
  const r = 6371, toRad = (d) => (d * Math.PI) / 180;
  const dphi = toRad(lat2 - lat1), dl = toRad(lng2 - lng1);
  const a = Math.sin(dphi / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dl / 2) ** 2;
  return 2 * r * Math.asin(Math.sqrt(a));
}

/* ---------- "API" layer (operates on the local DB) ---------- */

function apiSignup(payload) {
  const db = loadDB();
  const email = (payload.email || "").trim().toLowerCase();
  const name = (payload.name || "").trim();
  if (!["customer", "chemist"].includes(payload.role)) return { error: "Invalid role" };
  if (!name || !email || !payload.password || payload.password.length < 4) return { error: "Name, email and a password (4+ chars) are required" };
  if (db.users.some((u) => u.email === email)) return { error: "An account with this email already exists" };
  const uid = nextId(db, "user");
  const user = { id: uid, role: payload.role, name, email, password: payload.password, phone: (payload.phone || "").trim() };
  db.users.push(user);
  if (payload.role === "chemist") {
    db.chemists.push({ user_id: uid, shop_name: payload.shop_name || name, license_no: payload.license_no || "", address: payload.address || "", lat: payload.lat ?? null, lng: payload.lng ?? null, online: false });
  }
  saveDB(db);
  setSessionUserId(uid);
  return { user };
}

function apiLogin(email, password) {
  const db = loadDB();
  const user = db.users.find((u) => u.email === (email || "").trim().toLowerCase());
  if (!user || user.password !== password) return { error: "Invalid email or password" };
  setSessionUserId(user.id);
  return { user };
}

function apiLogout() { setSessionUserId(null); }

function apiMe() {
  const db = loadDB();
  const user = currentUser(db);
  if (!user) return { user: null };
  const resp = { user };
  if (user.role === "chemist") resp.chemist = db.chemists.find((c) => c.user_id === user.id) || null;
  return resp;
}

function apiCategories() {
  const db = loadDB();
  const seen = new Set(), out = [];
  for (const m of db.medicines) if (!seen.has(m.category)) { seen.add(m.category); out.push({ name: m.category, icon: m.icon }); }
  return out;
}

function apiMedicines({ q, category, popular } = {}) {
  const db = loadDB();
  let items = db.medicines;
  if (q) { const ql = q.toLowerCase(); items = items.filter((m) => m.name.toLowerCase().includes(ql) || m.brand.toLowerCase().includes(ql) || m.category.toLowerCase().includes(ql)); }
  if (category) items = items.filter((m) => m.category === category);
  if (popular) items = items.filter((m) => m.popular);
  return items;
}

function apiCart() {
  const db = loadDB();
  const user = currentUser(db);
  if (!user) return { error: "Login required" };
  const cart = db.carts[user.id] || [];
  const byId = Object.fromEntries(db.medicines.map((m) => [m.id, m]));
  let total = 0;
  const items = cart.map((line) => {
    const m = byId[line.medicine_id];
    if (!m) return null;
    const subtotal = m.price * line.qty;
    total += subtotal;
    return { medicine: m, qty: line.qty, subtotal };
  }).filter(Boolean);
  return { items, total };
}

function apiAddToCart(medicineId, qty) {
  const db = loadDB();
  const user = currentUser(db);
  if (!user) return { error: "Login required" };
  const cart = (db.carts[user.id] = db.carts[user.id] || []);
  const line = cart.find((l) => l.medicine_id === medicineId);
  if (line) line.qty = Math.max(1, line.qty + qty);
  else cart.push({ medicine_id: medicineId, qty: Math.max(1, qty) });
  saveDB(db);
  return { ok: true };
}

function apiRemoveFromCart(medicineId) {
  const db = loadDB();
  const user = currentUser(db);
  if (!user) return { error: "Login required" };
  db.carts[user.id] = (db.carts[user.id] || []).filter((l) => l.medicine_id !== medicineId);
  saveDB(db);
  return { ok: true };
}

function apiPlaceOrder({ address, prescription_file }) {
  const db = loadDB();
  const user = currentUser(db);
  if (!user) return { error: "Login required" };
  if (user.role !== "customer") return { error: "Only customers can place orders" };
  const cart = db.carts[user.id] || [];
  if (!cart.length && !prescription_file) return { error: "Your cart is empty and no prescription was attached" };
  const byId = Object.fromEntries(db.medicines.map((m) => [m.id, m]));
  let total = 0;
  const items = cart.map((l) => { const m = byId[l.medicine_id]; if (!m) return null; total += m.price * l.qty; return { medicine_id: m.id, name: m.name, qty: l.qty, price: m.price }; }).filter(Boolean);

  let notified = [];
  if (address && address.lat != null && address.lng != null) {
    const nearby = db.chemists.filter((c) => c.online && c.lat != null)
      .map((c) => ({ dist: haversineKm(address.lat, address.lng, c.lat, c.lng), uid: c.user_id }))
      .sort((a, b) => a.dist - b.dist);
    notified = nearby.slice(0, 6).map((n) => n.uid);
  }
  const id = nextId(db, "order");
  const order = { id, customer_id: user.id, customer_name: user.name, items, total, prescription_file: prescription_file || null, address, status: "pending", chemist_id: null, delivery_charge: null, notified_chemists: notified, created_at: Date.now(), updated_at: Date.now() };
  db.orders.push(order);
  db.carts[user.id] = [];
  saveDB(db);
  return { order };
}

function orderPublic(o, db) {
  let chemist_name = null;
  if (o.chemist_id) { const c = db.users.find((u) => u.id === o.chemist_id); chemist_name = c ? c.name : null; }
  return { ...o, chemist_name };
}

function apiMyOrders() {
  const db = loadDB();
  const user = currentUser(db);
  if (!user) return { error: "Login required" };
  return { orders: db.orders.filter((o) => o.customer_id === user.id).map((o) => orderPublic(o, db)).sort((a, b) => b.created_at - a.created_at) };
}

function apiChemistOnline(online) {
  const db = loadDB();
  const user = currentUser(db);
  if (!user || user.role !== "chemist") return { error: "Chemist login required" };
  const c = db.chemists.find((c) => c.user_id === user.id);
  if (!c) return { error: "Chemist profile not found" };
  c.online = online; saveDB(db);
  return { chemist: c };
}

function apiChemistIncoming() {
  const db = loadDB();
  const user = currentUser(db);
  if (!user || user.role !== "chemist") return { error: "Chemist login required" };
  return { orders: db.orders.filter((o) => o.status === "pending" && (!o.notified_chemists.length || o.notified_chemists.includes(user.id))).map((o) => orderPublic(o, db)).sort((a, b) => a.created_at - b.created_at) };
}

function apiChemistMine() {
  const db = loadDB();
  const user = currentUser(db);
  if (!user || user.role !== "chemist") return { error: "Chemist login required" };
  return { orders: db.orders.filter((o) => o.chemist_id === user.id).map((o) => orderPublic(o, db)).sort((a, b) => b.updated_at - a.updated_at) };
}

function apiAcceptOrder(oid) {
  const db = loadDB();
  const user = currentUser(db);
  if (!user || user.role !== "chemist") return { error: "Chemist login required" };
  const o = db.orders.find((o) => o.id === oid);
  if (!o) return { error: "Not found" };
  if (o.status !== "pending") return { error: "Order already taken" };
  o.status = "accepted"; o.chemist_id = user.id; o.updated_at = Date.now();
  saveDB(db);
  return { order: orderPublic(o, db) };
}

const VALID_TRANSITIONS = { accepted: "packed", packed: "out_for_delivery", out_for_delivery: "delivered" };

function apiUpdateStatus(oid, deliveryCharge) {
  const db = loadDB();
  const user = currentUser(db);
  if (!user || user.role !== "chemist") return { error: "Chemist login required" };
  const o = db.orders.find((o) => o.id === oid);
  if (!o || o.chemist_id !== user.id) return { error: "Not found" };
  const next = VALID_TRANSITIONS[o.status];
  if (!next) return { error: "Order cannot be advanced further" };
  if (next === "out_for_delivery" && deliveryCharge != null) o.delivery_charge = Number(deliveryCharge);
  o.status = next; o.updated_at = Date.now();
  saveDB(db);
  return { order: orderPublic(o, db) };
}

function toast(message) {
  let el = document.querySelector(".toast");
  if (!el) { el = document.createElement("div"); el.className = "toast"; document.body.appendChild(el); }
  el.textContent = message; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2400);
}
function escapeHtml(str) { return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function currency(n) { return "₹" + Number(n).toFixed(0); }
function truncate(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }

const STATUS_LABELS = { pending: "Order Placed", accepted: "Accepted by Chemist", packed: "Packed", out_for_delivery: "Out for Delivery", delivered: "Delivered" };
const STATUS_STEPS = ["pending", "accepted", "packed", "out_for_delivery", "delivered"];
const STATUS_STEP_LABELS = ["Confirmed", "Accepted", "Packed", "Out for Delivery", "Delivered"];

function stepperHtml(status) {
  const idx = STATUS_STEPS.indexOf(status);
  return STATUS_STEPS.map((s, i) => {
    const isLastReached = i === idx && i === STATUS_STEPS.length - 1;
    let cls = "step";
    if (i < idx || isLastReached) cls += " done"; else if (i === idx) cls += " current";
    const dot = (i < idx || isLastReached) ? "✓" : i + 1;
    return `<div class="${cls}"><div class="dot">${dot}</div><div class="label">${STATUS_STEP_LABELS[i]}</div></div>`;
  }).join("");
}

function saveAddress(addr) { localStorage.setItem("instarx_standalone_address", JSON.stringify(addr)); }

async function detectLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error("Geolocation is not supported")); return; }
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const { latitude, longitude } = pos.coords;
      let label = `${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}`);
        if (res.ok) { const data = await res.json(); if (data && data.display_name) label = data.display_name; }
      } catch (e) {}
      resolve({ lat: latitude, lng: longitude, label });
    }, (err) => reject(err), { enableHighAccuracy: true, timeout: 10000 });
  });
}
async function geocodeAddress(query) {
  const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=${encodeURIComponent(query)}`);
  if (!res.ok) throw new Error("Address lookup failed");
  const results = await res.json();
  if (!results.length) throw new Error("Couldn't find that address");
  const r = results[0];
  return { lat: parseFloat(r.lat), lng: parseFloat(r.lon), label: r.display_name };
}

}

  location.hash = "/" + path + qs;
}

function render() {

}

viewLogin.after = function (params) {
  const me = apiMe();
  if (me.user) { go(me.user.role === "chemist" ? "chemist" : "home"); return; }
  let mode = "login", role = "customer", chosenLocation = null;

  function setMode(m) {
    mode = m;
    document.querySelectorAll("#mode-toggle button").forEach((b) => b.classList.toggle("active", b.dataset.mode === m));
    document.getElementById("role-toggle-wrap").style.display = m === "signup" ? "flex" : "none";
    document.querySelectorAll(".signup-only").forEach((el) => (el.style.display = m === "signup" ? "block" : "none"));
    document.getElementById("chemist-fields").style.display = m === "signup" && role === "chemist" ? "block" : "none";
    document.getElementById("form-title").textContent = m === "login" ? "Welcome back" : "Create your account";
    document.getElementById("submit-btn").textContent = m === "login" ? "Login" : "Create Account";
    document.getElementById("switch-wrap").innerHTML = m === "login" ? `New to InstaRX? <a href="#" id="switch-link">Create an account</a>` : `Already have an account? <a href="#" id="switch-link">Login</a>`;
    document.getElementById("switch-link").addEventListener("click", (e) => { e.preventDefault(); setMode(mode === "login" ? "signup" : "login"); });
    document.getElementById("form-error").style.display = "none";
  }
  function setRole(r) {
    role = r;
    document.querySelectorAll("#role-toggle-wrap button").forEach((b) => b.classList.toggle("active", b.dataset.role === r));
    document.getElementById("chemist-fields").style.display = r === "chemist" ? "block" : "none";
  }
  document.querySelectorAll("#mode-toggle button").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
  document.querySelectorAll("#role-toggle-wrap button").forEach((b) => b.addEventListener("click", () => setRole(b.dataset.role)));
  document.getElementById("switch-link").addEventListener("click", (e) => { e.preventDefault(); setMode(mode === "login" ? "signup" : "login"); });
  document.getElementById("use-location-btn").addEventListener("click", async () => {
    const status = document.getElementById("location-status");
    status.textContent = "Detecting your location...";
    try { const loc = await detectLocation(); chosenLocation = loc; status.textContent = `\u{1F4CD} ${loc.label}`; const addrInput = document.querySelector('input[name="address"]'); if (!addrInput.value) addrInput.value = loc.label; }
    catch (e) { status.textContent = "Couldn't detect location — enter your address manually."; }
  });
  document.getElementById("auth-form").addEventListener("submit", (e) => {
    e.preventDefault();
    document.getElementById("form-error").style.display = "none";
    const fd = new FormData(e.target);
    let res;
    if (mode === "login") res = apiLogin(fd.get("email"), fd.get("password"));
    else {
      const payload = { role, name: fd.get("name"), email: fd.get("email"), password: fd.get("password"), phone: fd.get("phone") };
      if (role === "chemist") { payload.shop_name = fd.get("shop_name"); payload.license_no = fd.get("license_no"); payload.address = fd.get("address"); if (chosenLocation) { payload.lat = chosenLocation.lat; payload.lng = chosenLocation.lng; } }
      res = apiSignup(payload);
    }
    if (res.error) { const el = document.getElementById("form-error"); el.textContent = res.error; el.style.display = "block"; return; }
    toast(`Welcome${mode === "signup" ? " to InstaRX" : " back"}, ${res.user.name.split(" ")[0]}!`);
    go(res.user.role === "chemist" ? "chemist" : "home");
  });
  if (params.get("mode") === "signup") setMode("signup");
  if (params.get("role") === "chemist") { setMode("signup"); setRole("chemist"); }
};

    const next = { accepted: "packed", packed: "out_for_delivery", out_for_delivery: "delivered" }[o.status];
    let actionHtml = "";
    if (next === "out_for_delivery") actionHtml = `<div class="field" style="margin:10px 0 6px;"><label style="font-size:12px;">Personal transport charge (₹)</label><input type="number" min="0" step="1" placeholder="e.g. 30" class="charge-input" data-id="${o.id}" style="max-width:140px;"></div><button class="btn btn-secondary btn-sm advance-btn" data-id="${o.id}">Mark Out for Delivery</button>`;
    else if (next) actionHtml = `<button class="btn btn-secondary btn-sm advance-btn" data-id="${o.id}">Mark ${STATUS_LABELS[next]}</button>`;
    return `<div class="order-card">
      <div class="top-row"><b>Order #${o.id}</b><span class="badge ${o.status}">${STATUS_LABELS[o.status]}</span></div>
      <div style="font-size:13px;">${escapeHtml(o.customer_name)}</div>
      ${o.items.length ? `<ul>${o.items.map((i) => `<li>${escapeHtml(i.name)} &times; ${i.qty}</li>`).join("")}</ul>` : ""}
      <div style="font-weight:700;">${currency(o.total)}${o.delivery_charge ? ` + ${currency(o.delivery_charge)} delivery` : ""}</div>
      <div class="order-actions">${actionHtml}</div>
    </div>`;
  }).join("");
  el.querySelectorAll(".advance-btn").forEach((btn) => btn.addEventListener("click", () => {
    const chargeInput = el.querySelector(`.charge-input[data-id="${btn.dataset.id}"]`);
    const charge = chargeInput ? Number(chargeInput.value || 0) : null;
    const res = apiUpdateStatus(Number(btn.dataset.id), charge);
    if (res.error) toast(res.error); else toast("Order status updated");
    refreshChemist();
  }));
}

function viewTrack(params) {
  const me = apiMe();
  if (!me.user) return `<div class="page-header"><div class="container"><h1>Track Order</h1></div></div><section class="section"><div class="container"><div class="empty-state"><div class="big-emoji">\u{1F512}</div>Please <a href="#/login" style="color:var(--primary-dark);font-weight:700;">login</a> to track your orders.</div></div></section>`;
  if (me.user.role !== "customer") return `<div class="page-header"><div class="container"><h1>Track Order</h1></div></div><section class="section"><div class="container"><div class="empty-state">Chemist accounts should use the <a href="#/chemist" style="color:var(--primary-dark);font-weight:700;">dashboard</a> to manage orders.</div></div></section>`;
  return `<div class="page-header"><div class="container"><h1>Track Order</h1></div></div><section class="section"><div class="container"><div id="orders-list"></div></div></section>`;
}
viewTrack.after = function (params) {
  const me = apiMe();
  if (!me.user || me.user.role !== "customer") return;
  const highlightId = Number(params.get("order")) || null;
  const el = document.getElementById("orders-list");
  const { orders } = apiMyOrders();
  if (!orders.length) { el.innerHTML = `<div class="empty-state"><div class="big-emoji">\u{1F4E6}</div>You haven't placed any orders yet.<br><a href="#/category" class="btn btn-primary" style="margin-top:14px;">Browse Medicines</a></div>`; return; }
  el.innerHTML = orders.map((o) => `
    <div class="order-card" style="${highlightId === o.id ? "border-color:var(--primary);" : ""}">
      <div class="top-row"><b>Order #${o.id}</b><span class="badge ${o.status}">${STATUS_LABELS[o.status]}</span></div>
      <div class="stepper">${stepperHtml(o.status)}</div>
      <div style="font-size:13px;color:var(--text-muted);">${o.chemist_name ? `Being handled by <b>${escapeHtml(o.chemist_name)}</b>` : "Waiting for a nearby chemist to accept..."}</div>
      ${o.items.length ? `<ul>${o.items.map((i) => `<li>${escapeHtml(i.name)} &times; ${i.qty}</li>`).join("")}</ul>` : `<div style="font-size:13px;color:var(--text-muted);margin:6px 0;">\u{1F4C4} Prescription order</div>`}
      <div style="font-weight:700;">${currency(o.total)}${o.delivery_charge ? ` + ${currency(o.delivery_charge)} delivery` : ""}</div>
    </div>`).join("");
};
</script>
